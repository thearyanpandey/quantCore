[package]
name = "quantcore_ingestor"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }       # The Async Runtime
tokio-tungstenite = { version = "0.20", features = ["native-tls"] } # WebSocket Client
serde = { version = "1.0", features = ["derive"] }   # Serialization Framework
serde_json = "1.0"                                   # JSON Parsing
redis = { version = "0.23", features = ["tokio-comp"] } # Async Redis Client
futures-util = "0.3"                                 # Helpers for Async Streams
url = "2.4"                                          # URL Parsing
